# Forecasting Expert Comparison Configuration

dataset:
  source: "data/processed_train.csv"
  sub_train_pct: 0.8
  target: "sales"

experiment:
  forecast_horizon_days: 365
  random_seed: 42
  validation_protocol: "Chronological Sub-Validation Split"

models:
  - name: "XGBoost_Expert"
    class: "xgboost.XGBRegressor"
    parameters:
      n_estimators: 50
      learning_rate: 0.1
      max_depth: 8
      subsample: 1.0
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
  
  - name: "Random_Forest_Expert"
    class: "sklearn.ensemble.RandomForestRegressor"
    parameters:
      n_estimators: 50
      max_depth: 15
      min_samples_split: 2
      min_samples_leaf: 1
  
  - name: "ARIMA_Expert"
    class: "statsmodels.tsa.ar_model.AutoReg"
    parameters:
      lags: 7

metrics:
  - "MAE"
  - "RMSE"

output_paths:
  comparison_csv: "journal_extension/results/model_selection/expert_comparison_per_series.csv"
  winner_analysis_csv: "journal_extension/results/model_selection/model_winner_analysis.csv"
  specialization_summary_csv: "journal_extension/results/model_selection/model_specialization_summary.csv"
  plots_dir: "journal_extension/results/model_selection/"
