# OOS Calibration for Direct Multi-Horizon Point Forecasts Config

window_size: 100
lead_times: [1, 3, 5, 7]
nominal_coverages: [0.80, 0.90, 0.95]

calibration_data:
  input_path: "data/processed_train.csv"
  residuals_dir: "journal_extension/results/uncertainty/oos_direct"
  
validation_splits:
  n_splits: 5
  split_type: "TimeSeriesSplit"
  train_end_date: "2015-12-31"
  val_end_date: "2016-12-31"
  
quantile_convention: "Finite-Sample Correction Index: ceil((n + 1) * (1 - alpha))"
min_observations: 20
clip_zero: true
